<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Asesor Pedagógico Inteligente</title>
<link rel="stylesheet" href="css/app.css"></head><body>
<header><h1>Asesor Pedagógico Inteligente</h1><p>Evaluación, retroalimentación y mapa de competencias en IA · prototipo</p><p id="apiStatus" class="mu" style="font-size:12px">Conectando con el backend…</p>
<nav id="nav"></nav></header><main id="app"></main>
<script>
var TOPICS={busqueda:'Búsqueda',agentes:'Agentes',supervisado:'Aprendizaje supervisado',redes:'Redes neuronales',nlp:'Procesamiento de lenguaje',llm:'LLM y RAG',vision:'Visión artificial'};
var CATS=[['Razonamiento',['busqueda','agentes']],['Aprendizaje',['supervisado','redes']],['Lenguaje',['nlp','llm']],['Percepción',['vision']]];
function R(a){return a.map(function(r){return{n:r[0],w:r[1],kw:r[2]}})}
var LABS=[
{id:1,c:1,name:'Lab 1 · Búsqueda y agentes',topics:['busqueda','agentes'],v:'1.0',rub:R([['Algoritmo de búsqueda',40,['bfs','a*','heurística','nodos']],['Diseño del agente',30,['agente','percepción','acción','entorno']],['Análisis de resultados',30,['complejidad','comparación','tiempo']]]),
 txt:'Implementé BFS y A* con heurística de distancia sobre una cuadrícula de nodos. El agente percibe el entorno y elige una acción. Comparé tiempo de ejecución y complejidad.\ndef test_astar(): assert path'},
{id:2,c:1,name:'Lab 2 · Aprendizaje supervisado',topics:['supervisado'],v:'1.0',rub:R([['Preparación de datos',30,['normalización','partición','limpieza']],['Modelo y entrenamiento',40,['regresión','árbol','entrenamiento','hiperparámetros']],['Evaluación',30,['accuracy','f1','validación cruzada']]]),
 txt:'Hice limpieza y partición de datos. Entrené un árbol de decisión y una regresión logística, ajustando hiperparámetros. Evalué con accuracy.'},
{id:3,c:1,name:'Lab 3 · Redes neuronales',topics:['redes'],v:'1.1',rub:R([['Arquitectura',40,['capas','activación','neuronas']],['Entrenamiento',35,['backpropagation','épocas','optimizador','pérdida']],['Regularización',25,['dropout','overfitting']]]),txt:''},
{id:4,c:2,name:'Lab 4 · Procesamiento de lenguaje',topics:['nlp'],v:'1.0',rub:R([['Preprocesamiento',35,['tokenización','stopwords','lematización']],['Representación',35,['tf-idf','embeddings']],['Clasificación',30,['sentimiento','clasificador','f1']]]),txt:''},
{id:5,c:2,name:'Lab 5 · Visión artificial',topics:['vision'],v:'1.0',rub:R([['Datos de imágenes',30,['aumentación','etiquetas','resolución']],['Modelo CNN',40,['convolución','pooling','cnn']],['Métricas',30,['precisión','matriz de confusión']]]),txt:''},
{id:6,c:2,name:'Lab 6 · LLM y RAG',topics:['llm','nlp'],v:'1.2',rub:R([['Recuperación',35,['embeddings','vectorial','chunks']],['Prompting',35,['prompt','contexto','json']],['Evaluación y alucinaciones',30,['alucinación','citas','verificación']]]),txt:''}];
LABS.forEach(function(l){l.res=null;l.ok=false;l.adj=null});
var TEAM=[['Nicolás Barbosa','Arquitectura backend, base de datos y motor de evaluación determinista'],['Jerónimo','Gestión de rúbricas, ingesta de evidencias y sandbox de código'],['Sebastián Carrillo','Analítica de aprendizaje, informes integrados y mapa mental interactivo'],['Kevin','Panel docente, frontend UI y despliegue DevOps']];
var tab='res',cur=0,sel=null;
var TABS=[['res','Proyecto'],['rub','Rúbricas'],['eval','Evaluación'],['inf','Informe'],['map','Mapa mental']];
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function sumW(l){return l.rub.reduce(function(a,c){return a+(+c.w||0)},0)}
function lvl(s){return s>=4.5?'Sobresaliente':s>=3.5?'Alto':s>=2.5?'Básico':s>0?'Bajo':'Sin evidencia'}
function col(g){return g==null?'var(--bd)':g>=4?'var(--ok)':g>=3?'var(--wa)':'var(--er)'}
/* Backend: la nota la calcula el sistema, nunca el LLM */
function calc(l,r){var t=0;r.crit.forEach(function(c,i){t+=c.score*l.rub[i].w/100});return Math.round(t*10)/10}
function final(l){return l.res?(l.adj!=null?l.adj:l.res.prelim):null}
/* Evaluador simulado local: sustituir por llamada a un LLM con salida validada por JSON Schema */
function evaluate(l){
 var t=l.txt.toLowerCase(),sents=l.txt.split(/[.\n]/);
 var crit=l.rub.map(function(c){
  var hit=c.kw.filter(function(k){return t.indexOf(k)>-1});
  var sc=Math.round(hit.length/c.kw.length*5*2)/2;
  var ev=hit.length?(sents.filter(function(s){return s.toLowerCase().indexOf(hit[0])>-1})[0]||'').trim():'';
  return{criterio:c.n,peso:c.w,score:sc,nivel:lvl(sc),evidencia:ev||null,
   fortaleza:hit.length?'Evidencia de: '+hit.join(', '):null,
   brecha:hit.length<c.kw.length?'Falta evidenciar: '+c.kw.filter(function(k){return hit.indexOf(k)<0}).join(', '):null}});
 var r={laboratorio:l.name,version_rubrica:l.v,modelo:'simulado-local-v0',fecha:new Date().toISOString().slice(0,10),
  verificacion:{sintaxis:l.txt.length>40,pruebas_detectadas:/test|assert/.test(t),sandbox:'no ejecutado en este prototipo'},crit:crit};
 r.prelim=calc(l,r);return r}
function nav(){$('nav').innerHTML=TABS.map(function(x){return'<button class="'+(x[0]==tab?'on':'')+'" onclick="go(\''+x[0]+'\')">'+x[1]+'</button>'}).join('')}
function go(t){tab=t;nav();render();window.scrollTo(0,0)}
function labSel(){return'<select onchange="cur=+this.value;render()">'+LABS.map(function(l,i){return'<option value="'+i+'"'+(i==cur?' selected':'')+'>'+esc(l.name)+'</option>'}).join('')+'</select>'}
function vRes(){
 return'<div class="card"><h3>Abstract</h3><p>Plataforma web que permite a los estudiantes autoevaluar sus laboratorios de las cohortes 1 y 2 de IA. Interpreta rúbricas ponderadas, analiza las evidencias con un modelo de IA que devuelve JSON estructurado y calcula la nota (0,0–5,0) en el backend, con revisión y aprobación docente. Consolida un informe integral y un mapa mental de competencias. Este prototipo funciona en el navegador con un evaluador local simulado; la arquitectura prevé modelos locales o en la nube, sandbox y trazabilidad.</p><p class="mu">Stack objetivo: FastAPI + Pydantic · PostgreSQL · Docker sandbox sin red · LLM configurable · React.</p></div>'+
 '<div class="card"><h3>Equipo desarrollador</h3><div class="grid">'+TEAM.map(function(m){return'<div style="border:1px solid var(--bd);border-radius:8px;padding:12px"><b>'+m[0]+'</b><p class="mu" style="margin:6px 0 0;font-size:13px">'+m[1]+'</p></div>'}).join('')+'</div><p class="mu" style="margin-bottom:0"><small>Equipo de desarrollo del proyecto.</small></p></div>'}
function vRub(){
 var l=LABS[cur],s=sumW(l),ok=s==100;
 return'<div class="card row">'+labSel()+'<span class="tag">Rúbrica v'+l.v+'</span></div><div class="card"><div class="tw"><table><tr><th>Criterio</th><th>Peso %</th><th>Indicadores (separados por coma)</th><th></th></tr>'+
 l.rub.map(function(c,i){return'<tr><td><input value="'+esc(c.n)+'" onchange="LABS[cur].rub['+i+'].n=this.value"></td><td><input class="n" type="number" min="0" max="100" value="'+c.w+'" onchange="LABS[cur].rub['+i+'].w=+this.value;bump();render()"></td><td><input value="'+esc(c.kw.join(', '))+'" onchange="LABS[cur].rub['+i+'].kw=this.value.split(\',\').map(function(x){return x.trim().toLowerCase()}).filter(Boolean)"></td><td><button class="b s" onclick="LABS[cur].rub.splice('+i+',1);bump();render()">✕</button></td></tr>'}).join('')+'</table></div>'+
 '<div class="row" style="margin-top:10px"><button class="b s" onclick="LABS[cur].rub.push({n:\'Nuevo criterio\',w:0,kw:[\'clave\']});render()">+ Criterio</button><b class="'+(ok?'ok':'er')+'">Suma de ponderaciones: '+s+'%</b></div>'+
 (ok?'':'<p class="er" style="margin-bottom:0">Inconsistencia: las ponderaciones deben sumar 100 %. La evaluación está bloqueada hasta corregirla.</p>')+'</div>'}
function bump(){var l=LABS[cur];l.v=(parseFloat(l.v)+0.1).toFixed(1);l.res=null;l.ok=false;l.adj=null}
function vEval(){
 var l=LABS[cur],r=l.res,ok=sumW(l)==100;
 var h='<div class="card row">'+labSel()+'<span class="tag">Cohorte '+l.c+'</span><span class="tag">Rúbrica v'+l.v+'</span></div>'+
 '<div class="card"><h3>Solución del estudiante (texto del informe y código)</h3><label>Adjuntar evidencia (PDF, ZIP, código o imagen): <input type="file" accept=".pdf,.zip,.txt,.py,.js,.html,.docx,.pptx,.png,.jpg,.jpeg,.mp4" onchange="uploadEvidence(this)"></label><p class="mu"><small>Los archivos se guardan en el backend. Tamaño máximo: 25 MB.</small></p><textarea oninput="LABS[cur].txt=this.value">'+esc(l.txt)+'</textarea><div class="row" style="margin-top:8px"><button class="b" '+(ok?'':'disabled')+' onclick="LABS[cur].res=evaluate(LABS[cur]);LABS[cur].ok=false;LABS[cur].adj=null;persistEvaluation(LABS[cur]);render()">Evaluar con IA</button>'+(ok?'':'<span class="er">Rúbrica inconsistente</span>')+'</div></div>';
 if(!r)return h;
 h+='<div class="card"><div class="row" style="justify-content:space-between"><div><div class="mu">Nota preliminar (calculada por el backend)</div><div class="big" style="color:'+col(r.prelim)+'">'+r.prelim.toFixed(1)+'</div></div><div><span class="tag">'+(l.ok?'Aprobada por docente':'Pendiente de revisión')+'</span></div></div>'+
 '<div class="tw"><table><tr><th>Criterio</th><th>Peso</th><th>Valor</th><th>Nivel</th><th>Evidencia y retroalimentación</th></tr>'+
 r.crit.map(function(c){return'<tr><td>'+esc(c.criterio)+'</td><td>'+c.peso+'%</td><td><b>'+c.score.toFixed(1)+'</b></td><td>'+c.nivel+'</td><td><small>'+(c.evidencia?'“'+esc(c.evidencia.slice(0,110))+'”<br>':'')+(c.fortaleza?'<span class="ok">'+esc(c.fortaleza)+'</span><br>':'')+(c.brecha?'<span class="wa">'+esc(c.brecha)+'</span>':'')+'</small></td></tr>'}).join('')+'</table></div>'+
 '<div class="row" style="margin-top:10px"><label>Ajuste docente: <input class="n" style="width:70px" type="number" step="0.1" min="0" max="5" value="'+(l.adj!=null?l.adj:'')+'" placeholder="'+r.prelim.toFixed(1)+'" onchange="var v=parseFloat(this.value);LABS[cur].adj=isNaN(v)?null:Math.min(5,Math.max(0,v))"></label><button class="b" onclick="LABS[cur].ok=true;approveOnApi(LABS[cur]);render()">Aprobar y publicar</button></div></div>'+
 '<div class="card"><h3>Registro de trazabilidad (JSON estructurado)</h3><pre>'+esc(JSON.stringify({laboratorio:r.laboratorio,version_rubrica:r.version_rubrica,modelo:r.modelo,fecha:r.fecha,verificacion:r.verificacion,nota_preliminar:r.prelim,nota_final:final(l),criterios:r.crit.map(function(c){return{criterio:c.criterio,peso:c.peso,valor:c.score,nivel:c.nivel}})},null,1))+'</pre></div>';
 return h}
function vInf(){
 var done=LABS.filter(function(l){return l.res&&l.ok});
 if(!done.length)return'<div class="card">El informe consolida los laboratorios evaluados y <b>aprobados por el docente</b>. Evalúa y aprueba al menos uno en la pestaña Evaluación.</div>';
 var avg=done.reduce(function(a,l){return a+final(l)},0)/done.length,gaps=[];
 done.forEach(function(l){l.res.crit.forEach(function(c){if(c.score<3.5)gaps.push(l.name.split(' · ')[0]+' — '+c.criterio+(c.brecha?' ('+c.brecha.toLowerCase()+')':''))})});
 var h='<div class="card row" style="justify-content:space-between"><div><div class="mu">Promedio ponderado simple</div><div class="big" style="color:'+col(avg)+'">'+avg.toFixed(2)+'</div></div><div class="mu">'+done.length+' de '+LABS.length+' laboratorios aprobados</div></div>'+
 '<div class="card"><h3>Evolución por laboratorio</h3>'+LABS.map(function(l){var g=l.res&&l.ok?final(l):null;return'<div class="row" style="flex-wrap:nowrap;margin-bottom:6px"><span style="width:190px;flex:none"><small>'+esc(l.name)+'</small></span><div class="bar" style="flex:1"><i style="width:'+(g==null?0:g/5*100)+'%;background:'+col(g)+'"></i></div><b style="width:90px;text-align:right">'+(g==null?'<small class="mu">pendiente</small>':g.toFixed(1)+' · '+lvl(g))+'</b></div>'}).join('')+'</div>'+
 '<div class="card"><h3>Brechas y plan de fortalecimiento</h3>'+(gaps.length?'<ol style="margin:0;padding-left:20px">'+gaps.map(function(g){return'<li>'+esc(g)+'</li>'}).join('')+'</ol>':'<p class="ok" style="margin:0">No se detectaron brechas por debajo de 3,5.</p>')+'</div>';
 return h}
function mastery(t){var v=[];LABS.forEach(function(l){if(l.topics.indexOf(t)>-1&&l.res&&l.ok)v.push(final(l))});return v.length?v.reduce(function(a,b){return a+b},0)/v.length:null}
function vMap(){
 var cx=350,cy=235,n='<line x1="0" y1="0" x2="0" y2="0"/>',e='',N='';
 var step=2*Math.PI/CATS.length;
 CATS.forEach(function(c,i){
  var a=i*step-Math.PI/2,x=cx+Math.cos(a)*115,y=cy+Math.sin(a)*115;
  e+='<line x1="'+cx+'" y1="'+cy+'" x2="'+x+'" y2="'+y+'" stroke="var(--bd)" stroke-width="2"/>';
  N+='<g class="nd" onclick="sel=\'c'+i+'\';render()"><rect x="'+(x-48)+'" y="'+(y-15)+'" width="96" height="30" rx="15" fill="var(--sf)" stroke="var(--ac)" stroke-width="1.5"/><text x="'+x+'" y="'+(y+4)+'" text-anchor="middle" font-weight="600">'+c[0]+'</text></g>';
  c[1].forEach(function(t,j){
   var off=(j-(c[1].length-1)/2)*0.5,b=a+off,tx=cx+Math.cos(b)*215,ty=cy+Math.sin(b)*195,m=mastery(t);
   e+='<line x1="'+x+'" y1="'+y+'" x2="'+tx+'" y2="'+ty+'" stroke="var(--bd)"/>';
   N+='<g class="nd" onclick="sel=\''+t+'\';render()"><circle cx="'+tx+'" cy="'+ty+'" r="'+(sel==t?30:26)+'" fill="'+col(m)+'" fill-opacity=".25" stroke="'+col(m)+'" stroke-width="2.5"/><text x="'+tx+'" y="'+(ty+4)+'" text-anchor="middle" style="font-size:10px">'+TOPICS[t].split(' ')[0]+'</text></g>'})});
 N+='<g><circle cx="'+cx+'" cy="'+cy+'" r="34" fill="var(--ac)"/><text x="'+cx+'" y="'+(cy+5)+'" text-anchor="middle" style="fill:var(--bg);font-weight:700;font-size:15px">IA</text></g>';
 var d='<p class="mu" style="margin:0">Selecciona una temática para ver sus detalles.</p>';
 if(sel&&TOPICS[sel]){var m=mastery(sel),ls=LABS.filter(function(l){return l.topics.indexOf(sel)>-1});
  d='<h3>'+TOPICS[sel]+'</h3><p>Dominio: <b style="color:'+col(m)+'">'+(m==null?'sin evaluar':m.toFixed(1)+' · '+lvl(m))+'</b></p><p class="mu">Aplicado en: '+ls.map(function(l){return esc(l.name)}).join('; ')+'</p>'+
  ls.map(function(l){if(!(l.res&&l.ok))return'<p><small>'+esc(l.name.split(' · ')[0])+': pendiente de aprobación.</small></p>';return'<p><small><b>'+esc(l.name.split(' · ')[0])+'</b> — '+l.res.crit.map(function(c){return c.score>=3.5?'<span class="ok">✓ '+esc(c.criterio)+'</span>':'<span class="wa">▲ profundizar: '+esc(c.criterio)+'</span>'}).join(' · ')+'</small></p>'}).join('')}
 else if(sel&&sel[0]=='c'){var c=CATS[+sel.slice(1)];d='<h3>'+c[0]+'</h3><p class="mu">Incluye: '+c[1].map(function(t){return TOPICS[t]}).join(', ')+'</p>'}
 return'<div class="card"><div class="row" style="margin-bottom:6px"><span class="tag">● verde ≥ 4,0</span><span class="tag">● ámbar 3,0–3,9</span><span class="tag">● rojo &lt; 3,0</span><span class="tag">● gris sin evaluar</span></div><div class="tw"><svg viewBox="0 0 700 470" style="width:100%;min-width:560px">'+e+N+'</svg></div></div><div class="card">'+d+'</div>'}
async function apiStatus(){try{var r=await fetch('/api/health');if(!r.ok)throw Error();$('apiStatus').textContent='Backend conectado · almacenamiento local SQLite';$('apiStatus').className='ok'}catch(e){$('apiStatus').textContent='Backend no conectado · ejecuta el servidor desde backend';$('apiStatus').className='er'}}
async function persistEvaluation(l){try{var payload={student:'Estudiante demo',rubric_version:l.v,model_name:l.res.modelo,preliminary_grade:l.res.prelim,result:l.res};var r=await fetch('/api/laboratories/'+l.id+'/evaluations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(r.ok){var data=await r.json();l.apiEvaluationId=data.id}}catch(e){console.warn('No se pudo persistir la evaluación',e)}}
async function approveOnApi(l){if(!l.apiEvaluationId)return;try{await fetch('/api/evaluations/'+l.apiEvaluationId+'/approval',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({approved:true,final_grade:final(l)})})}catch(e){console.warn('No se pudo registrar aprobación',e)}}
async function uploadEvidence(input){var l=LABS[cur],f=input.files&&input.files[0];if(!f)return;var data=new FormData();data.append('file',f);data.append('student','Estudiante demo');try{var r=await fetch('/api/laboratories/'+l.id+'/evidence',{method:'POST',body:data});var result=await r.json();if(!r.ok)throw Error(result.detail||'Error al subir');alert('Evidencia almacenada: '+result.filename)}catch(e){alert('No se pudo almacenar la evidencia. Verifica que el backend esté activo. '+e.message)}input.value=''}
function render(){$('app').innerHTML={res:vRes,rub:vRub,eval:vEval,inf:vInf,map:vMap}[tab]()}
apiStatus();
nav();render();
</script><script src="/analytics.js"></script></body></html>
